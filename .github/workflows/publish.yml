name: Publish next reel

# Hourly, and the SCRIPT decides when to post -- not the cron.
#
# publish.py posts one reel once each slot's Central clock time has passed
# (9am, 1pm, 6pm -- SLOTS in publish.py) and does nothing on every other run.
# So whichever hourly run lands first after 9am posts the morning reel, and the
# rest of the hour's runs find the day on target and exit in seconds. The
# script reads Central time itself, so DST (2026-11-01) needs no edit here.
#
# Why not three fixed crons any more (changed 2026-10-05): GitHub's scheduler
# is best-effort, and through late Sept / early Oct it ran every slot 3-7 HOURS
# late, not minutes. Each cron fired once and landed wherever it landed:
#   - the 10pm "safety net" (03:41 UTC) arrived ~5am the NEXT day, posted that
#     day's morning reel at 4-6am, and could no longer rescue anything;
#   - on 10/05 a run went missing outright, and the day's third post rode on
#     a single remaining run with ~3h of slack before midnight.
# Every day still made three, but on one thread. Hourly runs turn a late or
# dropped run from a missed slot into a delay of an hour.
#
# Cost: ~24 short runs a day. This repo is public, so Actions minutes are free,
# and a run with nothing owed commits nothing.
#
# Minute is deliberately odd. On the hour is the most contended slot on the
# whole platform, and GitHub does not merely DELAY a congested schedule -- under
# enough load it DROPS the run entirely. Observed here 2026-08-14: the 18:00 run
# was still unqueued 21 minutes later. Odd minutes sit off the stampede.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage but do not publish"
        type: boolean
        default: false
      force:
        description: "Post now even if this slot is at target (still capped at 3/day)"
        type: boolean
        default: false

# NEVER add pull_request_target here. Secrets are withheld from fork PRs, and
# this repo is public -- schedule + manual dispatch are the only safe triggers.

# One run at a time. This is what replaces the old staging lock: two overlapping
# runs could otherwise claim the same queue item and double-post it.
concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: write          # to commit the updated queue.json back

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          python publisher/publish.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Commit the queue
        if: always()
        run: |
          git config user.name  "dadhax-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add -A queue.json '*.mp4'
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Publish run: update queue"
          # the reel loop pushes here too, so rebase onto whatever landed meanwhile
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          echo "could not push the queue after 3 tries" >&2
          exit 1
